name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --locked
      - name: Test browser setup helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build terminal test binary
        run: cargo build --locked
      - name: Test terminal workflows
        run: python3 scripts/smoke-test.py
      - name: Test custom themes
        run: python3 scripts/theme-smoke-test.py
      - name: Test privacy and OTP workflows
        run: python3 scripts/security-smoke-test.py
