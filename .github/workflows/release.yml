name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          expected = f'v{version}'
          if os.environ['RELEASE_TAG'] != expected:
              raise SystemExit(f'Release tag must match Cargo.toml: {expected}')
          PY
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Validate release source
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python3 -m unittest discover -s scripts -p 'test_*.py'
          cargo build --locked
          python3 scripts/smoke-test.py
          python3 scripts/theme-smoke-test.py
          python3 scripts/security-smoke-test.py
      - name: Build release binary
        run: cargo build --locked --release
      - name: Package binary and supporting files
        run: |
          package="passtui-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          mkdir -p "dist/$package/scripts"
          cp target/release/passtui README.md "dist/$package/"
          cp -R themes assets "dist/$package/"
          cp scripts/browser_setup.py scripts/setup-browser.py scripts/setup-brave.py "dist/$package/scripts/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          cd dist
          sha256sum "$package.tar.gz" > SHA256SUMS
      - name: Attest release archive
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.tar.gz
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft --generate-notes --title "PassTUI $RELEASE_TAG"
